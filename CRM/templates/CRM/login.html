{% extends "CRM/home.html" %}

{% load static %}

{% load crispy_forms_tags %}

{% block content %}          

<div class="container">
    <h3 class="py-2"></h3>
    <div class="col-9 mx-auto shadow-lg">
    <div class="row">
    <div class="card">

        <div class="container py-5">
            <h1>Login</h1>
            <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}
                <button class="btn btn-primary" type="submit">Login</button>
            </form>
            <p class="text-center py-4">Don't have an account? <a href="/registration">Create an account</a>.</p>
            <p class="py-2"></p>
        </div>

</div>
</div>
</div>
</div>



{% endblock content %}
