{% extends "CRM/home.html" %}

{% load static %}

{% load crispy_forms_tags %}

{% block content %}          

<div class="container">
    <h3 class="py-2"></h3>
    <div class="col-6 mx-auto shadow-lg">
    <div class="row">
    <div class="card">

    <form>

        <div class="container py-5">
            <h1>Register</h1>
            <form method="POST">
                
                {% csrf_token %}

                {{ register_form|crispy }}  
                             
                <button class="btn btn-primary" type="submit">Register</button>
            </form>
            <p class="text-center py-3">If you already have an account, <a href="/login">login</a> instead.</p>
        </div>

    </form>

</div>
</div>
</div>
</div>


{% endblock %}
